services:
  safe-sandbox:
    image: python:3.11-slim
    #read_only: true
    
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      - /run:rw,noexec,nosuid,size=64m
    
    volumes:
      # 🔒 READ-ONLY: Mount your host home directory
      - /home/tizz/:/host_home:ro 
      
      # ✍️ READ-WRITE: Your LLM-sandbox folder
      - /home/tizz/dev/LLM-sandbox/:/sandbox:rw
      
      # 📦 PERSISTENT: Python packages (pip install --user)
      - pip-packages:/root/.local

    command: tail -f /dev/null


volumes:
  pip-packages:   
